defaults:
  - ../config/envs@_here_
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null

# Midway SCALE-UP smoke: same proven deepspeed_train path as
# agentic_val_tictactoe_selfplay_midway_smoke.yaml (GREEN, jid 50252477), but
# grown along two axes only:
#   * model 0.5B -> Qwen3-4B (the config family's default model), template qwen3
#   * steps 3 -> 20
# Everything else (deepspeed ZeRO-2 actor, batch sizes, env groups, vllm/hf
# roles, tensorboard) is held identical to the GREEN smoke so the two variables
# above are isolated. NOT switching to megatron_train — staying on the path we
# already validated in the container.
exp_name: "agentic_tictactoe_selfplay_midway_scaleup"
seed: 42
system_envs:
  USE_MODELSCOPE: "0"

track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_OUTPUT_DIR}/tensorboard

num_gpus_per_node: 4

max_steps: 20
save_steps: 20
logging_steps: 1
eval_steps: 100
resume_from_checkpoint: false

rollout_batch_size: 16
val_batch_size: 16
sequence_length: 4096

dual_clip_loss: true
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
use_kl_loss: true
kl_loss_coef: 0.20

whiten_advantages: true
entropy_loss_coef: 0

pretrain: /project/rcc/mehta5/vllm/models/Qwen3-4B

actor_train:
  model_args:
    attn_implementation: eager
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    lr_scheduler_type: cosine_with_min_lr
    learning_rate: 1e-6
    weight_decay: 0.05
    adam_beta1: 0.9
    adam_beta2: 0.95
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    warmup_steps: 0
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: deepspeed_train
    strategy_config:
      ${deepspeed_zero2}
  device_mapping: list(range(0, ${num_gpus_per_node}))
  infer_batch_size: 2

actor_infer:
  model_args:
    attn_implementation: eager
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 1024
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.6
      block_size: 16
      load_format: auto
      enforce_eager: true
  device_mapping: list(range(0, ${num_gpus_per_node}))

reference:
  model_args:
    attn_implementation: eager
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: list(range(0, ${num_gpus_per_node}))
  infer_batch_size: 2

enable_response_mask: True
action_sep: "||"
use_turn_scores: True
enable_think: True
max_actions_per_traj: 20
reward_normalization:
  grouping: tags
  method: mean
  separate_norm_for_selfplay: true
whiten_rewards: true
advantage_norm: mean
pg_clip_high: 0.20

custom_envs:
  TicTacToe:
    env_type: tictactoe
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text

train_env_manager:
  format_penalty: 0.05
  max_env_num_per_worker: 8
  env_groups: 16
  group_size: 4
  tags: [TicTacToe]
  n_groups: [16]

val_env_manager:
  max_env_num_per_worker: 8
  env_groups: 16
  group_size: 1
  tags: [TicTacToe]
  n_groups: [16]
