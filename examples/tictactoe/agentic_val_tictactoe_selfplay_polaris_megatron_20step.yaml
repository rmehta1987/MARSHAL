defaults:
  - ../config/envs@_here_
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null
# Polaris MEGATRON 20-step proof run — the analog of Midway's GREEN scale-up
# (jid 50259767), single-axis change from the GREEN Polaris megatron smoke
# (agentic_val_tictactoe_selfplay_polaris_megatron.yaml, job 7197427): only
# max_steps 3 -> 20 and save_steps 3 -> 10 differ (two checkpoint writes prove
# incremental saving). Layout B, memory dials, env fan-out, and the launcher
# env are identical to the proven smoke; the RequestScheduler concurrency-pool
# patch (generate_scheduler.py, 2048 -> 256) provides the pids headroom the
# smoke lacked (it survived at 4094 of 4096).
# Walltime budget (measured from job 7197427): ~5 min init (staging + probes +
# Ray + HF->mca conversion) + 20 steps x ~110 s + 2 x ~2 min checkpoint writes
# ~= 47 min -> fits debug's 1 h cap with margin; preemptable is the fallback.
exp_name: "agentic_tictactoe_selfplay_polaris_megatron_20step"
seed: 42
system_envs:
  USE_MODELSCOPE: "0"

track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_OUTPUT_DIR}/tensorboard

num_gpus_per_node: 4

max_steps: 20
save_steps: 10
logging_steps: 1
eval_steps: 100
resume_from_checkpoint: false

rollout_batch_size: 16
val_batch_size: 16
sequence_length: 4096

dual_clip_loss: true
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
use_kl_loss: true
kl_loss_coef: 0.20

whiten_advantages: true
entropy_loss_coef: 0

pretrain: /lus/eagle/projects/lighthouse-uchicago/members/mehta5/models/Qwen3-4B

actor_train:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    lr_scheduler_type: cosine_with_min_lr
    learning_rate: 1e-6
    weight_decay: 0.05
    adam_beta1: 0.9
    adam_beta2: 0.95
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    warmup_steps: 0
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      sequence_parallel: true
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
      accumulate_allreduce_grads_in_fp32: true
      check_for_nan_in_loss_and_grad: false
  device_mapping: "[0,1,2,3]"   # TP=4: one 18 GB training-state shard per A100
  infer_batch_size: 2

actor_infer:
  model_args:
    attn_implementation: eager
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 1024
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.35
      block_size: 16
      max_model_len: 8192   # cap vs the 40960 default; see header (job 7197421)
      load_format: auto
      enforce_eager: true
  device_mapping: "[0]"   # 1 vLLM worker (pids); NCCL-broadcast weight-sync (see header)

reference:
  model_args:
    attn_implementation: eager
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: "[1]"   # frozen KL reference, 1 worker (pids)
  infer_batch_size: 2

enable_response_mask: True
action_sep: "||"
use_turn_scores: True
enable_think: True
max_actions_per_traj: 20
reward_normalization:
  grouping: tags
  method: mean
  separate_norm_for_selfplay: true
whiten_rewards: true
advantage_norm: mean
pg_clip_high: 0.20

custom_envs:
  TicTacToe:
    env_type: tictactoe
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text

train_env_manager:
  format_penalty: 0.05
  max_env_num_per_worker: 8
  env_groups: 2
  group_size: 4
  tags: [TicTacToe]
  n_groups: [2]

val_env_manager:
  max_env_num_per_worker: 8
  env_groups: 2
  group_size: 1
  tags: [TicTacToe]
  n_groups: [2]
