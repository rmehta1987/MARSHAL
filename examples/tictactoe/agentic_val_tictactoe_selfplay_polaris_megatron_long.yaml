defaults:
  - ../config/envs@_here_
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null
# Polaris MEGATRON LONG production run (~10.5 h of training inside a 12 h
# walltime on the preemptable queue) — the follow-on to the GREEN 20-step
# proof run (agentic_val_tictactoe_selfplay_polaris_megatron_20step.yaml,
# job 7197442). Single-axis discipline vs that proven config: only
# max_steps 20 -> 400, save_steps 10 -> 50, and resume_from_checkpoint
# (env-driven, for preemption recovery) change. Layout B, memory dials,
# env fan-out, and the launcher env are identical to the proven trio.
#
# Walltime math (measured on job 7197442, debug queue, same node type):
#   init (staging + probes + Ray + HF->mca conversion + step 0) = 7m37s
#   steps 1-19: 29m11s / 19 steps = 92.2 s/step average (range 75-117 s,
#   including the ~26 s checkpoint write inside its step window)
#   => 400 steps x 92.2 s + init ~= 10.4 h expected; at a pessimistic
#   100 s/step ~= 11.3 h — inside walltime=12:00:00 with buffer.
#
# save_steps=50: saves land at steps 49,99,...,399 ((step+1) % 50 == 0,
# base_pipeline.do_checkpoint), so the final step IS a save step. A
# preemption loses at most 50 steps ~= 77 min of work. Each megatron save
# is ~53 G (14 G/rank x 4 TP, measured); 8 saves = 424 G worst case on
# disk vs ~1.0 TB project-quota headroom (8.948T used / 10T soft limit,
# lfs quota 2026-06-12) — superseded saves are pruned mid-run (ROLL has
# no keep-last-N option; checkpoint_config only configures an uploader).
#
# resume_from_checkpoint is a PATH, not a bool-as-flag: base_pipeline
# joins it with "pipeline/" and ActorWorker passes it to
# megatron_strategy.load_checkpoint, which expects a MERGED checkpoint
# dir (iter_0000001/mp_rank_0{0..3} + dist_optimizer shards from all 4
# ranks + scheduler.pt + rng_state/ + pipeline/worker_state_pipeline.json)
# — the layout scripts/simlink_resume_dir.sh assembles. The PBS wrap
# (scripts/train_polaris_megatron_long.pbs) auto-assembles it from the
# latest complete save and exports MARSHAL_RESUME_DIR; unset => false =>
# fresh start. vllm/hf_infer roles inherit the base no-op load_checkpoint
# and actor_infer is re-synced by model_update at the first resumed step.
exp_name: "agentic_tictactoe_selfplay_polaris_megatron_long"
seed: 42
system_envs:
  USE_MODELSCOPE: "0"

track_with: tensorboard
tracker_kwargs:
  log_dir: ${oc.env:ROLL_OUTPUT_DIR}/tensorboard

num_gpus_per_node: 4

# save_steps lowered 50 -> 25 (2026-06-13) after three consecutive runs on the
# preemptable queue (job 7198332 run 2; job 7198659 runs 1-2) were preempted
# before the 50-step save interval (~80 min) could bank progress past
# checkpoint-49. 25 steps ~= 38 min at-risk window — ~2x the odds a run reaches
# a new save. Saves now at steps 24,49,74,...,399 ((step+1) % 25 == 0); final
# step is still a save step. Disk under control via the keep-newest-two-plus-
# final prune policy (~106-159 G of ~1 TB headroom). Compatible with resuming
# from the existing checkpoint-49: the wrap's scan keys off complete
# checkpoints on disk, not save_steps.
max_steps: 400
save_steps: 25
logging_steps: 1
eval_steps: 1000
# oc.decode is REQUIRED: bare oc.env returns the STRING "False" for the
# default, which is truthy in python and would wrongly trigger the resume
# path (found in the pre-submit dry-run). decode -> bool False / path str.
resume_from_checkpoint: ${oc.decode:${oc.env:MARSHAL_RESUME_DIR,false}}

rollout_batch_size: 16
val_batch_size: 16
sequence_length: 4096

dual_clip_loss: true
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
use_kl_loss: true
kl_loss_coef: 0.20

whiten_advantages: true
entropy_loss_coef: 0

pretrain: /lus/eagle/projects/lighthouse-uchicago/members/mehta5/models/Qwen3-4B

actor_train:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    lr_scheduler_type: cosine_with_min_lr
    learning_rate: 1e-6
    weight_decay: 0.05
    adam_beta1: 0.9
    adam_beta2: 0.95
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    warmup_steps: 0
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      sequence_parallel: true
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
      accumulate_allreduce_grads_in_fp32: true
      check_for_nan_in_loss_and_grad: false
  device_mapping: "[0,1,2,3]"   # TP=4: one 18 GB training-state shard per A100
  infer_batch_size: 2

actor_infer:
  model_args:
    attn_implementation: eager
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 1024
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.35
      block_size: 16
      max_model_len: 8192   # cap vs the 40960 default; see header (job 7197421)
      load_format: auto
      enforce_eager: true
  device_mapping: "[0]"   # 1 vLLM worker (pids); NCCL-broadcast weight-sync (see header)

reference:
  model_args:
    attn_implementation: eager
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: "[1]"   # frozen KL reference, 1 worker (pids)
  infer_batch_size: 2

enable_response_mask: True
action_sep: "||"
use_turn_scores: True
enable_think: True
max_actions_per_traj: 20
reward_normalization:
  grouping: tags
  method: mean
  separate_norm_for_selfplay: true
whiten_rewards: true
advantage_norm: mean
pg_clip_high: 0.20

custom_envs:
  TicTacToe:
    env_type: tictactoe
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text

train_env_manager:
  format_penalty: 0.05
  max_env_num_per_worker: 8
  env_groups: 2
  group_size: 4
  tags: [TicTacToe]
  n_groups: [2]

val_env_manager:
  max_env_num_per_worker: 8
  env_groups: 2
  group_size: 1
  tags: [TicTacToe]
  n_groups: [2]
